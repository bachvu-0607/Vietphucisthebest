<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Việt Phục Remix</title>
    <meta name="description" content="Ứng dụng tìm hiểu, lựa chọn, phối thử và hoàn thiện trang phục truyền thống Việt Nam (Việt phục) phù hợp sự kiện bằng công nghệ AI." />
    <meta property="og:title" content="Việt Phục Remix" />
    <meta property="og:description" content="Ứng dụng tìm hiểu, lựa chọn, phối thử và hoàn thiện trang phục truyền thống Việt Nam (Việt phục) phù hợp sự kiện bằng công nghệ AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Stub WebSocket for Vite HMR per AI Studio environment constraints (HMR disabled in Cloud Run iframe)
      (function() {
        if (typeof window !== 'undefined') {
          const OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            window.WebSocket = function (url, protocols) {
              const urlStr = String(url || '');
              const protoStr = String(protocols || '');
              if (
                protoStr.includes('vite-hmr') ||
                urlStr.includes('vite-hmr') ||
                urlStr.includes('token=')
              ) {
                const target = new EventTarget();
                const mock = {
                  readyState: 1,
                  OPEN: 1,
                  CLOSED: 3,
                  CLOSING: 2,
                  CONNECTING: 0,
                  send: function () {},
                  close: function () {},
                  addEventListener: function (event, handler, options) {
                    target.addEventListener(event, handler, options);
                    if (event === 'open') {
                      setTimeout(function () {
                        target.dispatchEvent(new Event('open'));
                      }, 0);
                    }
                  },
                  removeEventListener: function (event, handler, options) {
                    target.removeEventListener(event, handler, options);
                  },
                  dispatchEvent: function (event) {
                    return target.dispatchEvent(event);
                  }
                };
                return mock;
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSED = 3;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CONNECTING = 0;
          }

          // Global silence for any residual WebSocket/HMR rejection
          window.addEventListener('unhandledrejection', function (e) {
            const str = String(e.reason && (e.reason.stack || e.reason.message || e.reason) || '');
            if (
              str.includes('WebSocket') ||
              str.includes('closed without opened') ||
              str.includes('@vite/client') ||
              str.includes('vite-hmr')
            ) {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation && e.stopImmediatePropagation();
              return false;
            }
          }, true);

          window.addEventListener('error', function (e) {
            const str = String((e.message || '') + ' ' + (e.filename || '') + ' ' + (e.error || ''));
            if (
              str.includes('WebSocket') ||
              str.includes('closed without opened') ||
              str.includes('@vite/client') ||
              str.includes('vite-hmr')
            ) {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation && e.stopImmediatePropagation();
              return false;
            }
          }, true);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <div id="root"></div>

  </body>
</html>
