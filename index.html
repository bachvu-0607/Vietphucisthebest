    <script>
      // Ignore WebSocket and HMR errors per AI Studio environment constraints
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (String(e.reason).includes('WebSocket') ||
            String(e.reason.message || '').includes('WebSocket') ||
            String(e.reason.message || '').includes('closed without opened'))
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
      window.addEventListener('error', function (e) {
        if (
          e.message &&
          (e.message.includes('WebSocket') ||
            e.message.includes('closed without opened'))
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
